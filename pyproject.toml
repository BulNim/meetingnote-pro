[project]
name = "meetingnote-pro"
version = "0.1.0"
description = "MeetingNote Pro - 팀 회의록 (FastAPI + Vanilla JS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "email-validator>=2.2",
  "google-genai>=1.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "gemini: 실제 Gemini API 를 호출하는 테스트 (GEMINI_API_KEY 가 없으면 건너뜀)",
]
