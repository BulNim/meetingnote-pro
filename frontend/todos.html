<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 할 일 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="api.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote Pro</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto [scrollbar-width:none]">
      <a href="meetings.html" class="px-2.5 py-1 rounded-lg whitespace-nowrap text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">회의록</a>
      <span class="px-2.5 py-1 rounded-lg whitespace-nowrap bg-page dark:bg-chip">할 일</span>
      <a href="team.html" class="px-2.5 py-1 rounded-lg whitespace-nowrap text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">팀</a>
      <a href="profile.html" class="px-2.5 py-1 rounded-lg whitespace-nowrap text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">내 정보</a>
    </nav>
    <div class="ml-auto" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5">

  <!-- 탭 + 필터 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-4 mb-4">
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex gap-1 p-1 rounded-xl bg-page dark:bg-chip">
        <button id="tabMine" class="px-3 py-1.5 rounded-lg text-[13px] font-bold transition">내 할 일</button>
        <button id="tabAll"  class="px-3 py-1.5 rounded-lg text-[13px] font-bold transition">전체</button>
      </div>
      <select id="fWho" class="h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-[13px] font-bold focus:outline-none focus:border-blue-dot transition">
        <option value="all">담당자: 전체</option>
      </select>
      <span id="sum" class="ml-auto text-[12px] text-ink-3 dark:text-dim"></span>
      <button id="newBtn" type="button" class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">새 할 일</button>
    </div>
  </section>

  <!-- 칸반 3열 -->
  <div id="board" class="grid gap-3 md:grid-cols-3"></div>

  <div id="empty" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge px-5 py-12 text-center">
    <p class="text-sm font-bold" id="emptyTitle">배정된 할 일이 없음</p>
    <p class="text-[12px] text-ink-2 dark:text-dim mt-1" id="emptySub">전체 탭에서 팀 할 일을 보거나 새 할 일로 직접 등록</p>
  </div>

  <p class="mt-3 text-[11px] text-ink-3 dark:text-dim">카드를 끌어 옮기거나, 눌러서 옮길 칸을 고릅니다. 좁은 화면에서는 누르는 길을 씁니다.</p>
</main>

<!-- 칸 고르기 팝업 (E-05) -->
<div id="pickModal" class="hidden fixed inset-0 z-40 bg-black/40 grid place-items-center p-4">
  <section class="w-full max-w-sm rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5 shadow-xl">
    <div class="flex items-center mb-3">
      <h2 id="pickTitle" class="text-sm font-extrabold flex-1">칸 고르기</h2>
      <button data-close class="w-7 h-7 grid place-items-center rounded-lg text-ink-3 hover:bg-page dark:hover:bg-chip" aria-label="닫기">x</button>
    </div>
    <div id="pickBtns" class="grid grid-cols-3 gap-2"></div>
  </section>
</div>

<!-- 새 할 일 팝업 - 회의록 없이 칸반에서 바로 만든다 (E-13, POST /api/teams/{id}/todos) -->
<div id="newModal" class="hidden fixed inset-0 z-40 bg-black/40 grid place-items-center p-4">
  <section class="w-full max-w-md rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5 shadow-xl">
    <div class="flex items-center mb-3">
      <h2 class="text-sm font-extrabold flex-1">새 할 일</h2>
      <button data-close class="w-7 h-7 grid place-items-center rounded-lg text-ink-3 hover:bg-page dark:hover:bg-chip" aria-label="닫기">x</button>
    </div>
    <label class="block text-xs font-bold mb-1.5">내용 *</label>
    <input id="nWhat" placeholder="할 일 내용" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
    <div class="grid grid-cols-2 gap-3 mt-3">
      <div>
        <label class="block text-xs font-bold mb-1.5">담당자</label>
        <select id="nWho" class="w-full h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-[13px] font-bold focus:outline-none focus:border-blue-dot transition">
          <option value="">미정</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold mb-1.5">기한</label>
        <input id="nWhen" placeholder="예: 이번 주 안" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
      </div>
    </div>
    <label class="block text-xs font-bold mt-3 mb-1.5">출처</label>
    <input value="직접 등록" disabled class="w-full h-11 px-3.5 rounded-xl bg-line dark:bg-edge border border-line dark:border-edge text-sm text-ink-3 dark:text-dim">
    <div class="mt-4 flex gap-2.5 justify-end">
      <button data-close type="button" class="h-11 px-4 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold hover:border-ink dark:hover:border-dim transition">취소</button>
      <button id="nSave" type="button" class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">등록</button>
    </div>
  </section>
</div>

<!-- 삭제 확인 팝업 (E-11) -->
<div id="delModal" class="hidden">
  <section id="delBox">
    <h2 class="text-sm font-extrabold">할 일 삭제</h2>
    <p id="delMsg" class="text-[12px] text-ink-2 dark:text-dim mt-2"></p>
    <div class="mt-4 flex gap-2.5 justify-end">
      <button data-close type="button" id="delNo">취소</button>
      <button type="button" id="delYes">삭제</button>
    </div>
  </section>
</div>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  window.initTheme(() => render());

  const $ = (id) => document.getElementById(id);
  const COLS = [
    {key:"OPEN",  label:"대기", color:"orange"},
    {key:"DOING", label:"진행", color:"blue"},
    {key:"DONE",  label:"완료", color:"green"}
  ];
  const colLabel = (k) => COLS.find(c => c.key === k).label;

  // 삭제 확인 팝업 - theme.js 의 공통 팝업 클래스
  $("delModal").className = "hidden " + window.UI.overlay;
  $("delBox").className = window.UI.modal;
  $("delNo").className = window.UI.btnGhost;
  $("delYes").className = window.UI.btnDanger;

  let ME = null, TEAM = null, MEMBERS = [];
  let DATA = [], mine = true, dragId = null, overCol = null, menuId = null, delId = null;

  const isLate = (t) => window.isOverdue(t);  // 기한 날짜가 오늘보다 앞 · 미완료
  const whoName = (t) => t.assignee_name || "미정";
  const fail = (title, e) => window.toast("red", esc(title || e.msg), e.status ? esc(e.status + " " + e.code) : esc(e.msg));

  const chip = (t) => `
    <article data-id="${t.id}"
      class="card relative touch-none select-none cursor-grab active:cursor-grabbing rounded-xl bg-white dark:bg-surface border
             border-line dark:border-edge
             ${isLate(t) ? window.STRIPE.red : ""} p-3 hover:border-ink dark:hover:border-dim transition
             ${dragId === t.id && moved ?"opacity-40 border-dashed" : ""}">
      <p class="text-[13px] font-bold leading-snug">${esc(t.what)}</p>
      <p class="mt-1 text-[11px] text-ink-3 dark:text-dim">${esc(t.meeting_title || "직접 등록")}</p>
      <div class="mt-2 flex items-center gap-1.5">
        <span class="relative">
          <button type="button" data-act="assign" data-id="${t.id}"
            class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-page dark:bg-chip ${t.assignee_id ? "text-ink-2 dark:text-dim" : "text-ink-3 dark:text-dim"} hover:ring-1 hover:ring-ink-3 transition
                   ${menuId === t.id ? "ring-2 ring-orange-dot" : ""}">${esc(whoName(t))}  v</button>
          ${menuId === t.id ? `<div class="${window.UI.menu}">
            ${[{id:"", name:"미정"}].concat(MEMBERS).map(m => `<button type="button" data-pick="${m.id}" data-id="${t.id}" class="${String(t.assignee_id || "") === String(m.id) ? window.UI.menuOn : window.UI.menuItem}">${esc(m.name)}</button>`).join("")}
          </div>` : ""}
        </span>
        <button type="button" data-act="due" data-id="${t.id}"
          class="px-2 py-0.5 rounded-md text-[10px] font-bold ${isLate(t) ? "text-red-text dark:text-red-dot" : "text-ink-2 dark:text-dim"} bg-page dark:bg-chip hover:ring-1 hover:ring-ink-3 transition" title="${esc(t.due_text || "")}">${window.dueHtml(t)}</button>
        <button type="button" data-act="del" data-id="${t.id}" ${t.can_delete ? "" : "disabled"}
          class="ml-auto px-2 py-0.5 rounded-md text-[10px] font-bold bg-page dark:bg-chip transition ${t.can_delete ? "text-red-text dark:text-red-dot hover:ring-1 hover:ring-red-dot" : "text-ink-3 dark:text-dim opacity-40 cursor-not-allowed"}">삭제</button>
      </div>
    </article>`;

  // 끌어 오는 중인 카드의 반투명 사본 (E-03)
  const ghostCard = (t) => `
    <article class="rounded-xl bg-white/70 dark:bg-surface/70 border-2 border-blue-dot p-3 shadow-lg rotate-1">
      <p class="text-[13px] font-bold leading-snug">${esc(t.what)}</p>
      <p class="mt-1 text-[11px] font-bold text-orange-text dark:text-orange-dot">끌어 놓기</p>
    </article>`;

  // 담당자 필터 - 서버를 다시 부르지 않고 화면에서 거른다 (E-07)
  function filtered(){
    const f = $("fWho").value;
    if (f === "all") return DATA;
    if (f === "none") return DATA.filter(t => !t.assignee_id);
    return DATA.filter(t => String(t.assignee_id) === f);
  }

  function colEmpty(c){
    return mine && ME ? `${esc(ME.name)}에게 배정된 ${c.label} 할 일 없음` : "없음";
  }

  function render(){
    const rows = filtered();
    $("board").innerHTML = COLS.map(c => {
      const items = rows.filter(t => t.status === c.key);
      const hot = overCol === c.key;
      return `
      <section data-col="${c.key}"
        class="dropzone rounded-2xl border ${hot ? "border-dashed border-2 border-blue-dot bg-blue-dot/10" : "bg-white dark:bg-surface border-line dark:border-edge"}
               ${window.STRIPE[c.color]} p-4 min-h-[220px] transition">
        <div class="flex items-baseline gap-2 mb-3">
          <h2 class="text-sm font-extrabold ${window.LABEL[c.color]}">${c.label}</h2>
          <span class="text-[11px] text-ink-3 dark:text-dim">${items.length}건</span>
          ${hot ? `<span class="ml-auto text-[10px] font-extrabold text-blue-text dark:text-blue-dot">여기에 놓기</span>` : ""}
        </div>
        <div class="space-y-2.5">${items.map(chip).join("") ||
          `<p class="text-[12px] text-ink-3 dark:text-dim py-2">${colEmpty(c)}</p>`}</div>
      </section>`;
    }).join("");
    $("board").classList.toggle("hidden", DATA.length === 0);
    $("empty").classList.toggle("hidden", DATA.length > 0);
    if (mine) {
      $("emptyTitle").textContent = "배정된 할 일이 없음";
      $("emptySub").textContent = "전체 탭에서 팀 할 일을 보거나 새 할 일로 직접 등록";
    } else {
      $("emptyTitle").textContent = "팀 할 일이 없음";
      $("emptySub").textContent = "회의록을 올리면 자동으로 뽑히고, 「새 할 일」로 직접 등록도 가능";
    }
    const done = rows.filter(t => t.status === "DONE").length;
    $("sum").textContent = rows.length ? `${done} / ${rows.length} 완료` : "";
    $("tabMine").className = "px-3 py-1.5 rounded-lg text-[13px] font-bold transition " +
      (mine ? "bg-white dark:bg-surface shadow-sm" : "text-ink-2 dark:text-dim");
    $("tabAll").className = "px-3 py-1.5 rounded-lg text-[13px] font-bold transition " +
      (!mine ? "bg-white dark:bg-surface shadow-sm" : "text-ink-2 dark:text-dim");
    bindDrag();
    bindBadge();
  }

  // 서버가 돌려준 할 일로 바꿔 끼운다. 내 할 일 탭에서 나에게서 빠진 카드는 내린다
  function replace(t){
    const k = DATA.findIndex(x => x.id === t.id);
    if (k < 0) return;
    if (mine && t.assignee_id !== ME.id) DATA.splice(k, 1);
    else DATA[k] = t;
  }

  // 담당자 배지 - 눌러서 드롭다운 목록에서 고른다 (E-06). 기한 배지 - 눌러서 바꾼다. 삭제 (E-11)
  function bindBadge(){
    document.querySelectorAll("[data-act]").forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const t = DATA.find(x => x.id === +el.dataset.id);
        if (!t) return;
        if (el.dataset.act === "assign") {
          menuId = menuId === t.id ? null : t.id;
          render();
        } else if (el.dataset.act === "del") {
          if (!t.can_delete) return;
          menuId = null; delId = t.id;
          $("delMsg").textContent = `「${t.what}」 - 지우면 되돌릴 수 없음`;
          $("delModal").classList.remove("hidden");
        } else {
          menuId = null;
          const v = window.prompt("기한 (예: 이번 주 안 · 비우면 미정)", t.due_text || "");
          if (v === null) { render(); return; }
          try {
            replace(await API.put("/api/todos/" + t.id, {due_text: v.trim()}));
            window.toast("green", "기한 변경");
          } catch (err) { fail("기한 변경 실패", err); }
          render();
        }
      });
      el.addEventListener("pointerdown", (e) => e.stopPropagation());
    });
    document.querySelectorAll("[data-pick]").forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const t = DATA.find(x => x.id === +el.dataset.id);
        menuId = null;
        if (!t) { render(); return; }
        const id = el.dataset.pick === "" ? null : +el.dataset.pick;
        if (id === (t.assignee_id || null)) { render(); return; }
        try {
          const r = await API.put("/api/todos/" + t.id, {assignee_id: id});
          replace(r);
          window.toast("green", "담당자 배정 - " + esc(r.assignee_name || "미정"));
        } catch (err) { fail("담당자 배정 실패", err); }
        render();
      });
      el.addEventListener("pointerdown", (e) => e.stopPropagation());
    });
  }

  // 목록 밖을 누르면 담당자 목록을 닫는다
  document.addEventListener("click", () => { if (menuId !== null) { menuId = null; render(); } });

  // 끌어 옮기기 (E-03) - 포인터 이벤트 한 벌로 마우스 · 터치 · 펜을 모두 받는다
  //   HTML5 네이티브 드래그는 터치에서 이벤트가 뜨지 않아 쓰지 않는다
  let ghost = null, startX = 0, startY = 0, moved = false;

  function colUnder(x, y){
    const el = document.elementFromPoint(x, y);
    const z = el && el.closest(".dropzone");
    return z ? z.dataset.col : null;
  }

  // 누르기만 카드에 걸고, 움직임 · 놓기는 문서 한 곳에서 받는다
  //   끄는 중 render() 로 카드가 새로 그려져도 끌기가 끊기지 않게
  function bindDrag(){
    document.querySelectorAll(".card").forEach(el => {
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest("[data-act]") || e.target.closest("[data-pick]")) return;   // 배지는 누르는 것이지 끄는 것이 아님
        if (e.button !== undefined && e.button !== 0) return;
        dragId = +el.dataset.id;
        startX = e.clientX; startY = e.clientY; moved = false;
      });
    });
  }

  document.addEventListener("pointermove", (e) => {
    if (dragId === null) return;
    if (!moved) {
      if (Math.abs(e.clientX - startX) < 6 && Math.abs(e.clientY - startY) < 6) return;
      const t = DATA.find(x => x.id === dragId);
      if (!t) { dragId = null; return; }
      moved = true; menuId = null;
      ghost = document.createElement("div");
      ghost.className = "fixed pointer-events-none z-50 w-full max-w-sm";
      ghost.innerHTML = ghostCard(t);
      document.body.appendChild(ghost);
    }
    e.preventDefault();
    ghost.style.left = (e.clientX - 40) + "px";
    ghost.style.top = (e.clientY - 18) + "px";
    const c = colUnder(e.clientX, e.clientY);
    if (c !== overCol) { overCol = c; render(); }
  });

  function finish(e){
    if (dragId === null) return;
    if (ghost) { ghost.remove(); ghost = null; }
    const id = dragId, wasTap = !moved;
    const col = moved && e.type === "pointerup" ? colUnder(e.clientX, e.clientY) : null;
    dragId = null; overCol = null; moved = false;
    const t = DATA.find(x => x.id === id);
    render();
    if (!t) return;
    if (col) { if (t.status !== col) moveTo(t, col); return; }   // 같은 칸이면 아무것도 안 함
    // 끌지 않고 눌렀으면 옮길 칸을 고르는 팝업을 연다 (E-05, 좁은 화면의 길)
    if (wasTap && e.type === "pointerup") openPicker(id);
  }
  document.addEventListener("pointerup", finish);
  document.addEventListener("pointercancel", finish);

  // 놓는 순간 한 번만 저장 (E-04). 실패하면 원래 칸으로 되돌린다
  async function moveTo(t, col){
    const before = t.status;
    t.status = col; render();
    try {
      replace(await API.put("/api/todos/" + t.id, {status: col}));
      window.toast("green", "이동 완료 - " + colLabel(before) + " > " + colLabel(col));
    } catch (err) {
      t.status = before;
      fail("이동 실패 - " + colLabel(before) + " 칸으로 되돌림", err);
    }
    render();
  }

  // 카드를 누르면 뜨는 칸 고르기 팝업 (E-05)
  function openPicker(id){
    const t = DATA.find(x => x.id === id);
    if (!t) return;
    $("pickTitle").textContent = "칸 고르기 - " + t.what;
    $("pickBtns").innerHTML = COLS.map(c => t.status === c.key
      ? `<button type="button" disabled class="h-11 rounded-xl bg-page dark:bg-chip text-[13px] font-bold text-ink-3 dark:text-dim">${c.label} (지금)</button>`
      : `<button type="button" data-to="${c.key}" class="h-11 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge text-[13px] font-bold ${window.LABEL[c.color]} hover:border-ink dark:hover:border-dim transition">${c.label}</button>`
    ).join("");
    $("pickBtns").querySelectorAll("[data-to]").forEach(b => b.onclick = () => { closeModals(); moveTo(t, b.dataset.to); });
    $("pickModal").classList.remove("hidden");
  }
  const closeModals = () => ["pickModal", "newModal", "delModal"].forEach(i => $(i).classList.add("hidden"));
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModals);

  // 삭제 확인 뒤 DELETE -> 204. 403 이면 서버 msg 띠 알림
  $("delYes").onclick = async () => {
    const id = delId; closeModals();
    try {
      await API.del("/api/todos/" + id);
      DATA = DATA.filter(x => x.id !== id);
      window.toast("green", "할 일 삭제");
    } catch (err) { fail(null, err); }
    render();
  };

  async function load(){
    menuId = null;
    try {
      DATA = await API.get(mine ? "/api/me/todos" : "/api/teams/" + TEAM.id + "/todos");
    } catch (err) { DATA = []; fail("할 일을 불러오지 못함", err); }
    render();
  }

  $("tabMine").onclick = () => { if (!mine) { mine = true; load(); } };
  $("tabAll").onclick  = () => { if (mine) { mine = false; load(); } };
  $("fWho").onchange = () => { menuId = null; render(); };

  $("newBtn").onclick  = () => {
    $("nWhat").value = ""; $("nWho").value = ""; $("nWhen").value = "";
    $("nWhat").classList.remove("border-red-dot");
    $("newModal").classList.remove("hidden"); $("nWhat").focus();
  };
  $("nSave").onclick = async () => {
    const what = $("nWhat").value.trim();
    if (!what) { $("nWhat").classList.add("border-red-dot"); $("nWhat").focus(); return; }
    $("nSave").disabled = true;
    try {
      const who = $("nWho").value;
      const t = await API.post("/api/teams/" + TEAM.id + "/todos",
        {what, assignee_id: who ? +who : null, due_text: $("nWhen").value.trim()});
      if (!mine || t.assignee_id === ME.id) DATA.push(t);
      closeModals(); render();
      window.toast("green", "할 일 등록 - 출처 「직접 등록」");
    } catch (err) { fail("할 일 등록 실패", err); }
    $("nSave").disabled = false;
  };

  (async () => {
    let b;
    try { b = await boot({needTeam: true}); }
    catch (err) { fail("화면을 열지 못함", err); return; }
    ME = b.user; TEAM = b.team;
    try { MEMBERS = await API.get("/api/teams/" + TEAM.id + "/members"); }
    catch (err) { MEMBERS = []; fail("멤버를 불러오지 못함", err); }
    const opts = MEMBERS.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
    $("fWho").innerHTML = `<option value="all">담당자: 전체</option>` + opts + `<option value="none">미정</option>`;
    $("nWho").innerHTML = `<option value="">미정</option>` + opts;
    load();
  })();
</script>
</body>
</html>
