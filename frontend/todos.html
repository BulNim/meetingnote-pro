<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 할 일 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<div id="header"></div>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5">

  <!-- 탭 + 필터 -->
  <section id="bar" class="p-4 mb-4">
    <div class="flex flex-wrap items-center gap-2">
      <div id="tabs" class="flex gap-1 p-1 rounded-xl bg-page dark:bg-chip">
        <button id="tabMine" type="button">내 할 일</button>
        <button id="tabAll" type="button">전체</button>
      </div>
      <select id="fWho" aria-label="담당자 필터"></select>
      <span id="sum" class="ml-auto"></span>
    </div>
  </section>

  <!-- 칸반 3열 -->
  <div id="board" class="grid gap-3 md:grid-cols-3"></div>

  <div id="empty" class="hidden px-5 py-12 text-center">
    <p class="text-sm font-bold" id="emptyTitle">배정된 할 일이 없음</p>
    <p class="mt-1" id="emptySub">회의록을 올리면 할 일이 자동으로 뽑혀 나옴</p>
  </div>

  <p id="help" class="mt-3">카드를 끌어 옮기거나, 눌러서 옮길 칸을 고릅니다. 좁은 화면에서는 누르는 길을 씁니다.</p>
</main>

<script src="js/app.js"></script>
<script src="js/todos.js"></script>
</body>
</html>
