<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 내 정보</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="api.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="hidden sm:inline font-extrabold tracking-tight">MeetingNote</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto">
      <a href="meetings.html" class="whitespace-nowrap px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">회의록</a>
      <a href="todos.html" class="whitespace-nowrap px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">할 일</a>
      <a href="team.html" class="whitespace-nowrap px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">팀</a>
      <span class="whitespace-nowrap px-2.5 py-1 rounded-lg bg-page dark:bg-chip">내 정보</span>
    </nav>
    <div class="ml-auto" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 grid gap-4 lg:grid-cols-[1fr_1.3fr]">

  <!-- 왼쪽: 계정 -->
  <div class="space-y-4">
    <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
      <div class="flex items-center gap-3 mb-4">
        <div id="avatar" class="w-12 h-12 rounded-2xl bg-page dark:bg-chip border border-line dark:border-edge grid place-items-center text-lg font-extrabold"></div>
        <div>
          <p class="text-[15px] font-extrabold" id="who"></p>
          <p id="email" class="text-[12px] text-ink-3 dark:text-dim"></p>
        </div>
        <span id="roleBadge" class="hidden ml-auto px-2.5 py-1 rounded-md text-[11px] font-extrabold text-purple-text dark:text-purple-dot bg-page dark:bg-chip"></span>
      </div>

      <label class="block text-xs font-bold mb-1.5">이름</label>
      <input id="name"
        class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot focus:ring-2 focus:ring-blue-dot/25 transition">
      <p id="errName" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>

      <div class="mt-3.5 grid gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-bold mb-1.5">새 비밀번호</label>
          <input id="pw1" type="password" placeholder="8자 이상"
            class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1.5">한 번 더</label>
          <input id="pw2" type="password" placeholder="다시 입력"
            class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
        </div>
      </div>
      <p id="errPw" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>

      <div id="msg" class="hidden mt-3"></div>

      <div class="mt-4 flex gap-2.5">
        <button id="saveBtn" class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">저장</button>
        <button id="logoutBtn" class="h-11 px-4 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold hover:border-ink dark:hover:border-dim transition">로그아웃</button>
      </div>
    </section>

    <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
      <div class="flex items-baseline gap-2 mb-3">
        <h2 class="text-sm font-extrabold">내 할 일</h2>
        <span id="tCount" class="text-[11px] text-ink-3 dark:text-dim"></span>
        <a href="todos.html" class="ml-auto text-[11px] font-bold text-blue-text dark:text-blue-dot hover:underline">보드로</a>
      </div>
      <ul id="todos" class="space-y-2"></ul>
    </section>
  </div>

  <!-- 오른쪽: 내 활동 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">내 활동</h2>
      <span class="text-[11px] text-ink-3 dark:text-dim">최근 순</span>
      <span id="aCount" class="ml-auto text-[11px] text-ink-3 dark:text-dim"></span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
    <div id="aEmpty" class="hidden px-4 py-10 text-center">
      <p class="text-sm font-bold">아직 활동이 없음</p>
      <p class="text-[12px] text-ink-2 dark:text-dim mt-1">회의록을 올리거나 할 일을 처리하면 여기에 쌓임</p>
    </div>
  </section>
</main>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  window.initTheme(() => render());

  const $ = (id) => document.getElementById(id);
  const STATUS = { OPEN: {label: "대기", color: "orange"}, DOING: {label: "진행", color: "blue"}, DONE: {label: "완료", color: "green"} };
  const KIND_COLOR = { meeting_add: "blue", todo_assign: "orange", todo_done: "green", comment_add: "purple", member_join: "purple" };
  let TODOS = [], ACTS = [];

  function render() {
    $("todos").innerHTML = TODOS.length
      ? TODOS.map(t => { const st = STATUS[t.status]; return `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[st.color]} px-3.5 py-2.5">
        <p class="text-[13px] font-bold">${API.esc(t.what)}</p>
        <div class="mt-1 flex gap-1.5">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-white dark:bg-surface text-ink-2 dark:text-dim">${API.esc(t.due_text || "미정")}</span>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${window.LABEL[st.color]} bg-white dark:bg-surface">${st.label}</span>
        </div>
      </li>`; }).join("")
      : `<li class="text-[12px] text-ink-3 dark:text-dim">배정된 할 일이 없음</li>`;
    $("tCount").textContent = TODOS.length ? TODOS.length + "건" : "";
    $("acts").innerHTML = ACTS.map(a => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[KIND_COLOR[a.kind]]} px-3.5 py-2.5">
        <p class="text-[13px]">${API.esc(a.text)}</p>
        <p class="text-[11px] text-ink-3 dark:text-dim mt-0.5">${API.local(a.created_at)}  ·  <span class="font-mono">${a.kind}</span></p>
      </li>`).join("");
    $("aCount").textContent = ACTS.length ? ACTS.length + "건" : "";
    $("acts").classList.toggle("hidden", ACTS.length === 0);
    $("aEmpty").classList.toggle("hidden", ACTS.length > 0);        // J-07 활동 없음
  }

  const msg = (kind, title, body) => {
    $("msg").innerHTML = window.notice(kind, title, body);
    $("msg").classList.remove("hidden");
  };
  const clearErr = () => {
    ["errName", "errPw", "msg"].forEach(i => $(i).classList.add("hidden"));
    [$("name"), $("pw1"), $("pw2")].forEach(el => el.classList.remove("border-red-dot"));
  };
  const pwErr = (text, input) => { $("errPw").textContent = text; $("errPw").classList.remove("hidden"); input.classList.add("border-red-dot"); };

  function showMe(me) {
    $("who").textContent = me.name;
    $("name").value = me.name;
    $("email").textContent = me.email;
    $("avatar").textContent = me.name[0];
    $("roleBadge").textContent = me.role || "";
    $("roleBadge").classList.toggle("hidden", !me.role);
  }

  // J-02 ~ J-06 이름과 비밀번호 저장
  $("saveBtn").onclick = async () => {
    clearErr();
    const name = $("name").value.trim(), p1 = $("pw1").value, p2 = $("pw2").value;
    if (!name) { $("errName").textContent = "이름을 입력해 주세요"; $("errName").classList.remove("hidden"); $("name").classList.add("border-red-dot"); return; }
    if (p1 || p2) {
      if (p1 !== p2) return pwErr("두 비밀번호가 다름", $("pw2"));           // J-03 화면에서 먼저 거른다
      if (p1.length < 8) return pwErr("비밀번호는 8자 이상", $("pw1"));       // J-04
    }
    $("saveBtn").disabled = true; $("saveBtn").textContent = "저장 중...";    // J-05
    const body = { name };
    if (p1) body.password = p1;
    const r = await API.put("/api/auth/me", body);
    $("saveBtn").disabled = false; $("saveBtn").textContent = "저장";
    if (!r.ok) {
      if (r.data && r.data.code === "PASSWORD_TOO_WEAK") return pwErr("비밀번호는 8자 이상", $("pw1"));
      return msg("red", "저장하지 못함", (r.data && r.data.msg) || "다시 시도");
    }
    showMe(r.data);
    $("pw1").value = ""; $("pw2").value = "";
    msg("green", "저장함", p1 ? "비밀번호를 바꿈. 지금 로그인은 그대로 유효" : "이름을 바꿈");   // J-06
  };

  $("logoutBtn").onclick = async () => {
    await API.post("/api/auth/logout");        // 서버는 상태가 없으므로 화면이 토큰을 지운다
    API.clear();
    location.href = "login.html";
  };

  (async () => {
    if (!API.requireLogin()) return;
    const [me, todos, acts] = await Promise.all([API.get("/api/auth/me"), API.get("/api/me/todos"), API.get("/api/me/activities")]);
    if (me.ok) showMe(me.data);                // J-01
    TODOS = todos.ok ? todos.data : [];
    ACTS = acts.ok ? acts.data : [];
    render();
  })();
</script>
</body>
</html>
