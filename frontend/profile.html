<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 내 정보</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<div id="header"></div>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 grid gap-4 lg:grid-cols-[1fr_1.3fr]">

  <!-- 왼쪽: 계정 -->
  <div class="space-y-4">
    <section id="account" class="p-5">
      <div class="flex items-center gap-3 mb-4">
        <div id="avatar" class="w-12 h-12 rounded-2xl bg-page dark:bg-chip border border-line dark:border-edge grid place-items-center text-lg font-extrabold"></div>
        <div class="min-w-0">
          <p class="text-[15px] font-extrabold" id="who"></p>
          <p id="mail" class="truncate"></p>
        </div>
        <span id="role" class="hidden ml-auto"></span>
      </div>

      <label for="name" class="block text-xs font-bold mb-1.5">이름</label>
      <input id="name">
      <p id="errName" class="hidden"></p>

      <!-- 현재 비밀번호 - 프로그램정의 7-4 의 보안 규칙대로 구현에서 추가한 칸 (결정기록 D-024) -->
      <div class="mt-3.5">
        <label for="pwCur" class="block text-xs font-bold mb-1.5">현재 비밀번호 <span class="font-normal text-ink-3 dark:text-dim">(비밀번호를 바꿀 때만)</span></label>
        <input id="pwCur" type="password" autocomplete="current-password" placeholder="지금 쓰는 비밀번호">
        <p id="errCur" class="hidden"></p>
      </div>

      <div class="mt-3.5 grid gap-3 sm:grid-cols-2">
        <div>
          <label for="pw1" class="block text-xs font-bold mb-1.5">새 비밀번호</label>
          <input id="pw1" type="password" autocomplete="new-password" placeholder="8자 이상">
        </div>
        <div>
          <label for="pw2" class="block text-xs font-bold mb-1.5">한 번 더</label>
          <input id="pw2" type="password" autocomplete="new-password" placeholder="다시 입력">
        </div>
      </div>
      <p id="errPw" class="hidden"></p>

      <div id="msg" class="hidden mt-3"></div>

      <div class="mt-4 flex gap-2.5">
        <button id="saveBtn" type="button">저장</button>
        <button id="logoutBtn" type="button">로그아웃</button>
      </div>
      <p id="note" class="mt-3"></p>
    </section>

    <section id="todoBox" class="p-5">
      <div class="flex items-baseline gap-2 mb-3">
        <h2 class="text-sm font-extrabold">내 할 일</h2>
        <span id="tCount"></span>
        <a id="toBoard" href="todos.html" class="ml-auto text-[11px]">보드로</a>
      </div>
      <ul id="todos" class="space-y-2"></ul>
      <div id="tEmpty" class="hidden"></div>
    </section>
  </div>

  <!-- 오른쪽: 내 활동 -->
  <section id="actBox" class="p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">내 활동</h2>
      <span id="aLabel">최근 순</span>
      <span id="aCount" class="ml-auto"></span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
    <div id="aEmpty" class="hidden px-4 py-10 text-center">
      <p class="text-sm font-bold">아직 활동이 없음</p>
      <p id="aEmptySub" class="mt-1">회의록을 올리거나 할 일을 처리하면 여기에 쌓임</p>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
