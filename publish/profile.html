<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 내 정보</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote Pro</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto">
      <a href="meetings.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">회의록</a>
      <a href="todos.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">할 일</a>
      <a href="team.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">팀</a>
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">내 정보</span>
    </nav>
    <div class="ml-auto" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 grid gap-4 lg:grid-cols-[1fr_1.3fr]">

  <!-- 왼쪽: 계정 -->
  <div class="space-y-4">
    <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-2xl bg-page dark:bg-chip border border-line dark:border-edge grid place-items-center text-lg font-extrabold">김</div>
        <div>
          <p class="text-[15px] font-extrabold" id="who">김대리</p>
          <p class="text-[12px] text-ink-3 dark:text-dim">kim@example.com</p>
        </div>
        <span class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-extrabold text-purple-text dark:text-purple-dot bg-page dark:bg-chip">owner</span>
      </div>

      <label class="block text-xs font-bold mb-1.5">이메일 <span class="font-normal text-ink-3 dark:text-dim">(변경 불가)</span></label>
      <input value="kim@example.com" disabled
        class="w-full h-11 px-3.5 rounded-xl bg-line dark:bg-edge border border-line dark:border-edge text-sm font-mono text-ink-3 dark:text-dim mb-3.5">

      <label class="block text-xs font-bold mb-1.5">이름</label>
      <input id="name" value="김대리"
        class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot focus:ring-2 focus:ring-blue-dot/25 transition">
      <p id="errName" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>

      <div class="mt-3.5 grid gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-bold mb-1.5">새 비밀번호</label>
          <input id="pw1" type="password" placeholder="8자 이상"
            class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
          <p id="errPw1" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1.5">한 번 더</label>
          <input id="pw2" type="password" placeholder="다시 입력"
            class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
          <p id="errPw2" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>
        </div>
      </div>
      <p class="mt-1.5 text-[11px] text-ink-3 dark:text-dim">비밀번호 두 칸을 비워 두면 비밀번호는 그대로</p>

      <div class="mt-4 flex gap-2.5">
        <button id="saveBtn" class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">저장</button>
        <button class="h-11 px-4 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold hover:border-ink dark:hover:border-dim transition">로그아웃</button>
      </div>
    <!-- 퍼블리싱 확인용. 어느 API 가 이 상태를 만드는지 적는 줄이라 실제 구현에는 넣지 않는다 -->
    <p id="note" class="mt-3 text-[11px] text-ink-3 dark:text-dim"></p>
    </section>

    <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
      <div class="flex items-baseline gap-2 mb-3">
        <h2 class="text-sm font-extrabold">내 할 일</h2>
        <span id="tCount" class="text-[11px] text-ink-3 dark:text-dim"></span>
        <a href="todos.html" class="ml-auto text-[11px] font-bold text-blue-text dark:text-blue-dot hover:underline">보드로</a>
      </div>
      <ul id="todos" class="space-y-2"></ul>
      <div id="tEmpty" class="hidden rounded-xl border border-dashed border-line dark:border-edge px-4 py-6 text-center">
        <p class="text-sm font-bold">배정된 할 일 없음</p>
      </div>
    </section>
  </div>

  <!-- 오른쪽: 내 활동 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">내 활동</h2>
      <span class="text-[11px] text-ink-3 dark:text-dim">최근 순</span>
      <span id="aCount" class="ml-auto text-[11px] text-ink-3 dark:text-dim"></span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
    <div id="aEmpty" class="hidden px-4 py-10 text-center">
      <p class="text-sm font-bold">활동 기록 없음</p>
      <p class="text-[12px] text-ink-2 dark:text-dim mt-1">팀 생성은 활동 kind 5종에 없음. 회의록을 올리거나 할 일을 처리하면 여기에 쌓임</p>
    </div>
  </section>
</main>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  window.initTheme(() => render());

  const $ = (id) => document.getElementById(id);

  const TODOS = [
    {what:"목록 화면 및 검색 구현", when:"다음 주 금요일", status:"DOING", color:"blue"},
    {what:"MVP 범위 문서화", when:"9월 12일", status:"DONE", color:"green"}
  ];
  const ACTS = [
    {what:"회의록 「2차 스프린트 계획 회의」 등록", when:"오늘 14:12", kind:"meeting_add", color:"blue"},
    {what:"할 일 「Neon 연결 정보 정리」를 박과장에게 배정", when:"오늘 14:15", kind:"todo_assign", color:"orange"},
    {what:"회의록 「배포 환경 점검」에 댓글 작성", when:"어제 11:02", kind:"comment_add", color:"purple"},
    {what:"할 일 「MVP 범위 문서화」 완료", when:"9월 12일", kind:"todo_done", color:"green"}
  ];
  let acts = ACTS.slice(), todos = TODOS.slice();

  const STATUS = { OPEN:"대기", DOING:"진행", DONE:"완료" };

  function render(){
    $("todos").innerHTML = todos.map(t => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[t.color]} px-3.5 py-2.5">
        <p class="text-[13px] font-bold">${t.what}</p>
        <div class="mt-1 flex gap-1.5">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-white dark:bg-surface text-ink-2 dark:text-dim">${t.when}</span>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${window.LABEL[t.color]} bg-white dark:bg-surface">${STATUS[t.status]}</span>
        </div>
      </li>`).join("");
    $("tCount").textContent = todos.length ? todos.length + "건" : "";
    $("todos").classList.toggle("hidden", todos.length === 0);
    $("tEmpty").classList.toggle("hidden", todos.length > 0);
    $("acts").innerHTML = acts.map(a => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[a.color]} px-3.5 py-2.5">
        <p class="text-[13px]">${a.what}</p>
        <p class="text-[11px] text-ink-3 dark:text-dim mt-0.5">${a.when}  ·  <span class="font-mono">${a.kind}</span></p>
      </li>`).join("");
    $("aCount").textContent = acts.length ? acts.length + "건" : "";
    $("acts").classList.toggle("hidden", acts.length === 0);
    $("aEmpty").classList.toggle("hidden", acts.length > 0);
  }

  const PW8 = "password1";
  const errOn = (id, input, t) => { $(id).textContent = t; $(id).classList.remove("hidden"); input.classList.add("border-red-dot"); };
  const reset = () => {
    ["errName","errPw1","errPw2"].forEach(i => $(i).classList.add("hidden"));
    [$("name"), $("pw1"), $("pw2")].forEach(el => el.classList.remove("border-red-dot"));
    $("saveBtn").disabled = false; $("saveBtn").textContent = "저장";
    $("name").value = "김대리"; $("pw1").value = ""; $("pw2").value = ""; $("who").textContent = "김대리";
    acts = ACTS.slice(); todos = TODOS.slice(); render();
  };

  // 스토리보드 J-01 ~ J-07
  const STATES = {
    "view": () => { reset(); $("note").textContent = "GET /api/auth/me 200. 이메일은 고칠 수 없음"; },
    "edit-name": () => {
      reset(); $("name").value = "김민수"; $("name").focus();
      $("note").textContent = "저장 클릭 > PUT /api/auth/me 200. 이름만 보내면 비밀번호는 그대로";
    },
    "pw-mismatch": () => {
      reset(); $("pw1").value = PW8; $("pw2").value = PW8 + "x";
      errOn("errPw2", $("pw2"), "두 비밀번호가 다름 - 서버로 보내지 않음");
      $("note").textContent = "저장 클릭 > 화면에서 먼저 거름";
    },
    "pw-weak": () => {
      reset(); $("pw1").value = "12345"; $("pw2").value = "12345";
      errOn("errPw1", $("pw1"), "비밀번호는 8자 이상");
      $("note").textContent = "저장 클릭 > 400 PASSWORD_TOO_WEAK";
    },
    "saving": () => {
      reset(); $("pw1").value = PW8; $("pw2").value = PW8;
      $("saveBtn").disabled = true; $("saveBtn").textContent = "저장 중...";
      $("note").textContent = "저장 클릭 후 버튼 잠김 - 2번 눌리지 않게";
    },
    "saved": () => {
      reset();
      window.toast("green", "저장함 - 비밀번호 칸 비움", "PUT /api/auth/me 200");
      $("note").textContent = "계정 변경은 팀 활동이 아니라 내 활동에 기록하지 않음";
    },
    "no-activity": () => {
      reset(); acts = []; todos = []; render();
      $("note").textContent = "팀을 막 만든 owner - 팀 생성은 활동 kind 5종에 없어 0건 (합류는 member_join 이 남음)";
    }
  };

  $("saveBtn").onclick = () => STATES["saved"]();

  window.stateBar([
    {key:"view",        label:"내 정보"},
    {key:"edit-name",   label:"이름 변경"},
    {key:"pw-mismatch", label:"비밀번호 불일치"},
    {key:"pw-weak",     label:"약한 비밀번호"},
    {key:"saving",      label:"저장 중"},
    {key:"saved",       label:"저장 완료"},
    {key:"no-activity", label:"활동 없음"}
  ], (key) => STATES[key]());
</script>
</body>
</html>
