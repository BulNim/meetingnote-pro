<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 팀 설정</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote Pro</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto">
      <a href="meetings.html" data-needteam class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">회의록</a>
      <a href="todos.html" data-needteam class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">할 일</a>
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">팀</span>
      <a href="profile.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">내 정보</a>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <span id="viewer" class="hidden sm:inline text-[12px] text-ink-3 dark:text-dim">김대리 · 기획팀</span>
      <div id="themeSlot"></div>
    </div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 space-y-4">

  <!-- 팀 만들기 / 합류 (소속 팀이 없을 때). 회의록 · 할 일 화면에 들어갈 수 없음 -->
  <section id="onboard" class="hidden">
    <p class="text-[12px] text-ink-3 dark:text-dim mb-3">소속 팀이 없어 회의록 · 할 일 화면에 들어갈 수 없음. 팀을 만들거나 초대코드로 합류</p>
    <div class="grid gap-3 sm:grid-cols-2">
      <div class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
        <p class="text-[15px] font-extrabold">팀 만들기</p>
        <p class="text-[12px] text-ink-3 dark:text-dim mt-0.5 mb-3">만든 사람이 owner</p>
        <label class="block text-xs font-bold mb-1.5">팀 이름</label>
        <input id="newName" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition" placeholder="예: 기획팀">
        <div class="mt-3 flex justify-end">
          <button class="h-11 px-5 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">만들기</button>
        </div>
      </div>
      <div class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
        <p class="text-[15px] font-extrabold">초대코드로 합류</p>
        <p class="text-[12px] text-ink-3 dark:text-dim mt-0.5 mb-3">owner 에게 받은 코드 입력</p>
        <label class="block text-xs font-bold mb-1.5">초대코드</label>
        <input id="joinCode" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm font-mono tracking-widest focus:outline-none focus:border-blue-dot transition" placeholder="MN-7K2D">
        <p id="joinErr" class="hidden mt-1.5 text-[11px] font-semibold text-red-text dark:text-red-dot"></p>
        <div class="mt-3 flex justify-end">
          <button id="joinBtn" class="h-11 px-5 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">합류</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 팀 정보 -->
  <section id="info" class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex flex-wrap items-start gap-4">
      <div class="flex-1 min-w-[200px]">
        <p id="nameLabel" class="text-[11px] font-bold text-ink-3 dark:text-dim mb-1">팀 이름</p>
        <div class="flex gap-2">
          <input id="tName" value="기획팀"
            class="flex-1 min-w-0 h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm font-bold focus:outline-none focus:border-blue-dot transition">
          <button id="saveName" type="button" class="h-11 px-4 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-[13px] font-bold hover:border-ink dark:hover:border-dim transition">저장</button>
        </div>
      </div>
      <div>
        <p class="text-[11px] font-bold text-ink-3 dark:text-dim mb-1">초대코드  <span class="font-normal">팀당 코드 하나 · 정원 6명</span></p>
        <div class="flex gap-2">
          <div class="h-11 px-4 grid place-items-center rounded-xl bg-page dark:bg-chip border border-line dark:border-edge
                      font-mono text-sm font-extrabold tracking-[0.2em]" id="code">MN-7K2D</div>
          <button id="copyBtn" class="h-11 px-3.5 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-[13px] font-bold hover:border-ink dark:hover:border-dim transition">복사</button>
          <button id="newCodeBtn" class="h-11 px-3.5 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-[13px] font-bold hover:border-ink dark:hover:border-dim transition">재발급</button>
        </div>
      </div>
    </div>
    <!-- 퍼블리싱 확인용. 어느 API 가 이 상태를 만드는지 적는 줄이라 실제 구현에는 넣지 않는다 -->
    <p id="note" class="mt-3 text-[11px] text-ink-3 dark:text-dim"></p>
  </section>

  <!-- 멤버 -->
  <section id="memSec" class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">멤버 <span id="mCap" class="text-ink-3 dark:text-dim font-bold">4 / 6</span></h2>
      <span class="ml-auto text-[11px] text-ink-3 dark:text-dim">팀당 6명 이내</span>
    </div>
    <ul id="members" class="grid gap-2 sm:grid-cols-2"></ul>
  </section>

  <!-- 활동 기록 -->
  <section id="actSec" class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">활동 기록</h2>
      <span class="text-[11px] text-ink-3 dark:text-dim">최근 순</span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
  </section>
</main>

<!-- 정원 초과 팝업 - 409 TEAM_FULL (F-06) -->
<div id="fullModal" class="hidden fixed inset-0 z-40 bg-black/40 grid place-items-center p-4">
  <section class="w-full max-w-sm rounded-2xl bg-white dark:bg-surface border border-red-dot p-5 shadow-xl">
    <h2 class="text-sm font-extrabold text-red-text dark:text-red-dot">팀 정원이 찼음</h2>
    <p class="text-[12px] text-ink-2 dark:text-dim mt-2">기획팀은 이미 6명. owner 에게 문의</p>
    <p class="text-[11px] font-mono text-red-text dark:text-red-dot mt-1">409 TEAM_FULL</p>
    <div class="mt-4 flex justify-end">
      <button id="fullOk" class="h-11 px-5 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">확인</button>
    </div>
  </section>
</div>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  window.initTheme(() => render());

  const $ = (id) => document.getElementById(id);

  // todos = todo_count. 배정된 할 일 전부(완료 포함) - todos.html 의 샘플과 같은 수
  const MEMBERS = [
    {name:"김대리", email:"kim@example.com", role:"owner",  todos:2},
    {name:"박과장", email:"park@example.com", role:"member", todos:1},
    {name:"이주임", email:"lee@example.com",  role:"member", todos:2},
    {name:"최선임", email:"choi@example.com", role:"member", todos:1}
  ];

  const ACTS = [
    {who:"김대리", what:"회의록 「2차 스프린트 계획 회의」 등록", when:"오늘 14:12", color:"blue"},
    {who:"김대리", what:"할 일 「Neon 연결 정보 정리」를 박과장에게 배정", when:"오늘 14:15", color:"orange"},
    {who:"최선임", what:"할 일 「배포 키 환경변수 이전」 완료", when:"어제 17:40", color:"green"},
    {who:"박과장", what:"초대코드로 합류", when:"9월 18일", color:"purple"}
  ];

  function render(){
    $("members").innerHTML = MEMBERS.map(m => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge grid place-items-center text-[13px] font-extrabold">${m.name[0]}</div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-bold">${m.name}</p>
          <p class="text-[11px] text-ink-3 dark:text-dim truncate">${m.email}</p>
        </div>
        <div class="text-right shrink-0">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${m.role === "owner" ? window.LABEL.purple : window.LABEL.blue} bg-white dark:bg-surface">${m.role}</span>
          <p class="mt-1 text-[10px] text-ink-3 dark:text-dim">할 일 ${m.todos}</p>
        </div>
      </li>`).join("");
    $("mCap").textContent = MEMBERS.length + " / 6";
    $("acts").innerHTML = ACTS.map(a => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[a.color]} px-3.5 py-2.5">
        <p class="text-[13px]"><span class="font-bold">${a.who}</span>  ·  ${a.what}</p>
        <p class="text-[11px] text-ink-3 dark:text-dim mt-0.5">${a.when}</p>
      </li>`).join("");
  }

  const LOCK = ["opacity-40", "pointer-events-none"];
  const noTeam = (on) => {
    $("onboard").classList.toggle("hidden", !on);
    ["info", "memSec", "actSec"].forEach(i => $(i).classList.toggle("hidden", on));
    document.querySelectorAll("[data-needteam]").forEach(a => a.classList.toggle("opacity-30", on));
    $("viewer").textContent = on ? "소속 팀 없음" : "김대리 · 기획팀";
  };

  // 스토리보드 F-01 ~ F-08
  const STATES = {
    "team": () => {
      noTeam(false); $("fullModal").classList.add("hidden");
      $("tName").value = "기획팀"; $("tName").readOnly = false; $("tName").classList.remove("opacity-60");
      $("nameLabel").textContent = "팀 이름";
      [$("newCodeBtn"), $("saveName")].forEach(b => { b.disabled = false; b.classList.remove(...LOCK); });
      $("code").textContent = "MN-7K2D";
      $("code").classList.remove("ring-2", "ring-green-dot", "text-green-text");
      $("joinCode").value = ""; $("joinCode").classList.remove("border-red-dot"); $("joinErr").classList.add("hidden");
      render();
      $("note").textContent = "팀 이름(owner 만 수정) · 초대코드 · 멤버 · 활동 기록";
    },
    "onboard": () => {
      STATES["team"](); noTeam(true);
      $("joinCode").value = "MN-7K2D"; $("joinCode").focus();
    },
    "join-err": () => {
      STATES["onboard"]();
      $("joinCode").value = "MN-0000"; $("joinCode").classList.add("border-red-dot");
      $("joinErr").textContent = "없는 초대코드 - 계정은 그대로 유지";
      $("joinErr").classList.remove("hidden");
    },
    "copied": () => {
      STATES["team"]();
      window.toast("green", "초대코드를 복사함 - MN-7K2D", "받는 사람은 회원가입 뒤 초대코드로 합류");
      $("note").textContent = "코드는 팀당 하나. 사람마다 다르게 발급하지 않음";
    },
    "recode": () => {
      STATES["team"]();
      $("code").textContent = "MN-Q8P3";
      $("code").classList.add("ring-2", "ring-green-dot", "text-green-text");
      window.toast("green", "새 초대코드 발급 - MN-7K2D 폐기", "PUT /api/teams/1/code 200");
      $("note").textContent = "재발급은 owner 만. 이미 합류한 멤버는 그대로";
    },
    "save-name": () => {
      STATES["team"]();
      $("tName").value = "기획1팀"; $("tName").focus();
      window.toast("green", "팀 이름 저장", "PUT /api/teams/1 200");
      $("note").textContent = "owner 만. member 가 부르면 403 OWNER_ONLY";
    },
    "full": () => {
      STATES["onboard"]();
      $("fullModal").classList.remove("hidden");
    },
    "member-view": () => {
      STATES["team"]();
      $("viewer").textContent = "이주임 · 기획팀";
      $("nameLabel").textContent = "팀 이름 (owner 만 수정)";
      $("tName").readOnly = true; $("tName").classList.add("opacity-60");
      $("newCodeBtn").disabled = true; $("saveName").disabled = true;
      [$("newCodeBtn"), $("saveName")].forEach(b => b.classList.add(...LOCK));
      $("note").textContent = "보는 사람 이주임(member). owner 전용 2종(팀 이름 · 코드 재발급) 잠김. 코드 복사는 가능";
    }
  };

  $("saveName").onclick = () => window.toast("green", "팀 이름 저장", "PUT /api/teams/1 200");
  $("copyBtn").onclick = () => STATES["copied"]();
  $("newCodeBtn").onclick = () => STATES["recode"]();
  $("fullOk").onclick = () => $("fullModal").classList.add("hidden");

  window.stateBar([
    {key:"team",        label:"팀 설정"},
    {key:"onboard",     label:"소속 팀 없음"},
    {key:"join-err",    label:"초대코드 오류"},
    {key:"copied",      label:"코드 복사"},
    {key:"recode",      label:"코드 재발급"},
    {key:"full",        label:"정원 초과"},
    {key:"save-name",   label:"팀 이름 저장"},
    {key:"member-view", label:"member 권한"}
  ], (key) => STATES[key]());
</script>
</body>
</html>
